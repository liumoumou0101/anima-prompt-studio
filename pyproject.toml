[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anima-prompt-studio"
version = "2.0.0"
description = "Offline-first Chinese prompt compiler with remote ComfyUI execution for ANIMA image models"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7,<3",
  "PySide6-Essentials>=6.7,<7",
]

[project.optional-dependencies]
resources = ["huggingface-hub>=0.34,<1", "requests>=2.32"]
translation = ["transformers>=4.44,<5", "sentencepiece>=0.2", "sacremoses>=0.1", "torch>=2.2", "requests>=2.32"]
remote = ["paramiko>=3.4,<5", "requests>=2.32,<3", "websocket-client>=1.8,<2"]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
anima-prompt-studio = "anima_prompt_studio.app.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
anima_prompt_studio = ["configs/**/*.json", "web_gallery/dist/**/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
norecursedirs = ["reports", "build", ".git", ".venv"]
addopts = "-q"
